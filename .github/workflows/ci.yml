name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

# Every third-party action is pinned to a commit SHA (the tag is in the comment).
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0; version from packageManager

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (includes the OpenAPI contract)
        run: pnpm test

      # Testcontainers starts Postgres 16, Redis 7 and RustFS on the runner's Docker daemon.
      - name: Integration tests (includes audit coverage)
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level=high

      - name: Export OpenAPI
        run: pnpm --filter api openapi:export

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi
          path: apps/api/openapi.json
          if-no-files-found: error

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, file: apps/api/Dockerfile, target: runtime }
          - { name: migrate, file: apps/api/Dockerfile, target: migrate }
          - { name: web, file: apps/web/Dockerfile, target: runtime }
          - { name: backup, file: infra/backup/Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build ${{ matrix.image.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          build-args: RELEASE=${{ github.sha }}
          tags: govserve-${{ matrix.image.name }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Container scan (fixable HIGH or CRITICAL fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: govserve-${{ matrix.image.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Software bill of materials (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: govserve-${{ matrix.image.name }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.image.name }}.cdx.json
          skip-setup-trivy: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.image.name }}
          path: sbom-${{ matrix.image.name }}.cdx.json
          if-no-files-found: error

  # Playwright against the production images, wired exactly as `make up` does locally.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve govserve.localhost
        run: echo '127.0.0.1 govserve.localhost' | sudo tee -a /etc/hosts

      - name: Start the stack (make up)
        run: make up

      - name: Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-end tests (make e2e)
        run: make e2e

      - name: Stack logs on failure
        if: failure()
        run: >-
          docker compose --env-file infra/.local/stack.env -f infra/docker-compose.prod.yml
          -f infra/docker-compose.local.yml logs --tail=200

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
