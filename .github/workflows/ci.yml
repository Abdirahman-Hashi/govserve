name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Testcontainers starts Postgres 16 + Redis 7 on the runner's Docker daemon,
      # the same way it does locally (no service containers to keep in sync).
      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Export OpenAPI
        run: pnpm --filter api openapi:export

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json
          if-no-files-found: error
