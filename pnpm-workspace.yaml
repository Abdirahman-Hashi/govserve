packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  '@swc/core': true
  prisma: true
  '@prisma/engines': true
  '@prisma/client': true
  '@nestjs/core': false
  ssh2: false
  cpu-features: false
  protobufjs: false
  '@parcel/watcher': false
  '@scarf/scarf': false
  unrs-resolver: true
